<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <!-- House/triangle top shape -->
  <polyline points="20,70 60,30 100,70" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- X mark above house -->
  <line x1="48" y1="18" x2="72" y2="42" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="18" x2="48" y2="42" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <!-- House bottom / video player box -->
  <rect x="20" y="70" width="80" height="40" rx="6" stroke="currentColor" stroke-width="5" fill="none"/>
  <!-- Play button triangle inside box -->
  <polygon points="52,82 52,98 70,90" fill="currentColor"/>
  <!-- MediaHut Studios text -->
  <text x="118" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="currentColor" letter-spacing="-0.5">MediaHut</text>
  <text x="118" y="105" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="currentColor" letter-spacing="-0.5">Studios</text>
</svg>
